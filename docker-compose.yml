services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: poolsbot
      POSTGRES_PASSWORD: poolsbot
      POSTGRES_DB: poolsbot
    ports:
      - "5432:5432"
    volumes:
      - poolsbot_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  poolsbot_pgdata:
